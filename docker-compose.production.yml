version: '3.8'

services:
  elercam:
    image: ghcr.io/mksavin/elercam-bot:latest
    # build: .
    container_name: elercam
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
#      - ./media:/media
      - ./config.ts:/app/config.ts
    networks:
      - mongo
      - mosquitto
    env_file: .env

  mongo:
    build:
      context: .deployment/mongo
      args:
        MONGO_VERSION: 6
    restart: unless-stopped
    environment:
      MONGO_REPLICA_HOST: host.docker.internal
      MONGO_REPLICA_PORT: 27017
      # Use "mongo" instead of "mongosh" before v5.0
      MONGO_COMMAND: 'mongosh'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '27017:27017'
    networks:
      - mongo
    healthcheck:
      # Use "mongo" instead of "mongosh" before v5.0
      test: [ 'CMD', 'mongosh', 'admin', '--port', '27017', '--eval', "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 2s
      retries: 20

  mongo-express:
    image: mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    networks:
      - mongo
    environment:
      #  ME_CONFIG_MONGODB_ADMINUSERNAME: root
      #  ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: false

  elercam-media-1:
    image: ghcr.io/mksavin/elercam-media:latest
    restart: unless-stopped
    volumes:
      - ./media:/media
    environment:
      FRIGATE_LOCAL_URL: http://localhost:3080/ # warning: use host without authorization!
      MEDIA_PUBLIC_PATH: /media
      MEDIA_TEMP_PATH: /tmp

  elercam-media-2:
    image: ghcr.io/mksavin/elercam-media:latest
    restart: unless-stopped
    volumes:
      - ./media:/media
    environment:
      FRIGATE_LOCAL_URL: http://localhost:3080/ # warning: use host without authorization!
      MEDIA_PUBLIC_PATH: /media
      MEDIA_TEMP_PATH: /tmp

networks:
  mongo:
    driver: bridge
  mosquitto:
    external: true
