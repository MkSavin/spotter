services:
  spotter-bot:
    image: ghcr.io/mksavin/spotter-bot:latest
    # build: .
    container_name: spotter-bot
    restart: unless-stopped
    volumes:
      - ./.env.bot:/app/.env
      - ./bot.config.ts:/app/config.ts
      # Persist the SQLite database across container restarts.
      - ./.docker/bot:/app/data
    networks:
      - redis
      - minio
    depends_on:
      - redis
      - minio

  spotter-depot-1:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - redis
      - minio
    depends_on:
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0'] # this is only needed when using multiple GPUs
              count: 1 # number of GPUs
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - .env.depot-1:/app/.env

  spotter-depot-2:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - redis
      - minio
    depends_on:
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0'] # this is only needed when using multiple GPUs
              count: 1 # number of GPUs
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - .env.depot-2:/app/.env

  spotter-sink:
    image: ghcr.io/mksavin/spotter-sink:latest
    restart: unless-stopped
    volumes:
      - .env.sink:/app/.env
    networks:
      - mosquitto
      - redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - redis
    ports:
      - '6379:6379'
    # appendonly keeps the streams durable across restarts: a crashed depot's
    # pending entries survive and get reclaimed by the reaper on recovery.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  #  minio:
  #    volumes:
  #      - .docker/minio:/data
  #    image: quay.io/minio/minio:latest
  #    command: server --console-address ":9001" /data/minio
  #    ports:
  #      - '9010:9000'
  #      - '9011:9001'
  #    networks:
  #      - minio
  #    environment:
  #      MINIO_ROOT_USER: admin
  #      MINIO_ROOT_PASSWORD: some-minio-access
  #      MINIO_BROWSER_REDIRECT_URL: "${MINIO_BROWSER_URL}"
  #    healthcheck:
  #      test: ['CMD', 'mc', 'ready', 'local']
  #      interval: 5s
  #      timeout: 5s
  #      retries: 5

networks:
  minio:
    driver: bridge
  redis:
    driver: bridge
  mosquitto:
    external: true
