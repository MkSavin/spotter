# version: '3.8'

services:
  spotter-bot:
    image: ghcr.io/mksavin/spotter-bot:latest
    # build: .
    container_name: spotter-bot
    restart: unless-stopped
    volumes:
      - ./.env.bot:/app/.env
      - ./bot.config.ts:/app/config.ts
    networks:
      - kafka
      - mongo
      - minio
    depends_on:
      - kafka
      - mongo
      - minio

  spotter-depot-1:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - kafka
      - minio
    depends_on:
      - kafka
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0'] # this is only needed when using multiple GPUs
              count: 1 # number of GPUs
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - .env.depot-1:/app/.env

  spotter-depot-2:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - kafka
      - minio
    depends_on:
      - kafka
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0'] # this is only needed when using multiple GPUs
              count: 1 # number of GPUs
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - .env.depot-2:/app/.env

  spotter-sink:
    image: ghcr.io/mksavin/spotter-sink:latest
    restart: unless-stopped
    volumes:
      - .env.sink:/app/.env
    networks:
      - mosquitto
      - kafka
    depends_on:
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: unless-stopped
    networks:
      - kafka
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:latest
    restart: unless-stopped
    networks:
      - kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
      - '9997:9997'
      - '29092:29092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - kafka
    depends_on:
      - zookeeper
      - kafka
    ports:
      - '8082:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997

  kafka-init:
    image: confluentinc/cp-kafka:latest
    networks:
      - kafka
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:29092 --list

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic spotter.event --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic spotter.event.test_seed --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic spotter.event.media_requested --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic spotter.event.media_processed --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic spotter.camera.frame_requested --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic spotter.camera.frame_processed --replication-factor 1 --partitions 1

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

