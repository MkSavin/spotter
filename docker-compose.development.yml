  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - spotter
    ports:
      - '1883:1883'
      - '8883:8883'
      - '9001:9001'
    volumes:
      - .deployment/mosquitto/config:/mosquitto/config
      - .docker/mosquitto/data:/mosquitto/data

