services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    ports:
      - '6379:6379'
    # appendonly keeps the streams durable across restarts (a crashed depot's
    # pending entries survive and get reclaimed by the reaper).
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - .docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

