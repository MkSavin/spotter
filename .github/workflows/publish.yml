name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      checks: read
      statuses: write
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
        persist-credentials: true

    - name: 'Setup Biome'
      uses: biomejs/setup-biome@v2
      with:
        version: latest

    - name: 'Run Biome'
      run: biome ci .

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Configure commiter'
      run: |
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

    - name: 'Install dependencies'
      run: bun install

    - name: 'Conventional changesets'
      run: bunx zx .integration/conventional.mjs
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: 'Create Release Pull Request or Publish to npm'
      id: changesets
      uses: changesets/action@v1
      with:
        # This expects you to have a script called release which does a build for your packages and calls changeset publish
        publish: exit 0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Imperative image building'
      if: steps.changesets.outputs.hasChangesets == 'true'
      run: bunx zx .integration/imperative.mjs --versions="${{steps.changesets.outputs.publishedPackages}}"
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
