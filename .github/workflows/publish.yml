name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      checks: read
      statuses: write
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: 'Setup Biome'
      uses: biomejs/setup-biome@v2
      with:
        version: latest

    - name: 'Run Biome'
      run: biome ci .

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install bun'
      run: bun install -g zx-bulk-release

    - name: 'Bulk Release'
      run: zx-bulk-release --include-private true --npm-fetch false
      env:
        DEBUG: true
        GIT_COMMITTER_NAME: 'semrel-extra-bot'
        GIT_COMMITTER_EMAIL: 'semrel-extra-bot@hotmail.com'
        GH_USER: ${{github.actor}}
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: 'Imperative image building'
      run: bunx zx .integration/imperative.mjs --file=.build-meta
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
