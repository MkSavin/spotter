name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: 'Setup Biome'
      uses: biomejs/setup-biome@v2
      with:
        version: latest

    - name: 'Run Biome'
      run: biome ci .

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Semantic Release'
      run: bunx zx-bulk-release --include-private true
#      run: bun multi-semantic-release --dry-run --ignore-private=false --ignore-packages="packages/*"
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: 'Imperative image building'
      run: bunx zx .integration/imperative.mjs --file=.build-meta
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
