name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: latest

    - name: Run Biome
      run: biome ci .

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install packages'
      run: bun install semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/npm conventional-changelog-conventionalcommits

    - name: 'Semantic Release'
      run: bunx semantic-release
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: 'Build Inventory Image'
      run: |
        docker build . --build-arg NPM_TOKEN=${{secrets.GITHUB_TOKEN}} --file Dockerfile --tag ghcr.io/mksavin/elercam:latest
        docker push ghcr.io/mksavin/elercam:latest
