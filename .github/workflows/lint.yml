name: 'Lint'

on:
  workflow_dispatch:
  # On PRs this is the required gate before merging (see branch protection).
  pull_request:
    branches: [ master ]
  push:
    branches:
      - '**'
      - '!master'

permissions:
  contents: read

concurrency:
  # head_ref on PRs, ref on pushes — otherwise a branch and its PR count twice.
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    # Both linters come from the lockfile, so CI and local runs cannot drift
    # apart — and commitlint resolves its `extends` from our node_modules.
    - name: 'Run commitlint'
      env:
        # Empty on a brand-new branch, where `before` is all zeroes.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ]; then
          BASE=$(git rev-parse HEAD~1)
        fi
        bunx commitlint --from "$BASE" --to HEAD

    - name: 'Run Biome'
      run: bunx biome ci .

    - name: 'Typecheck'
      run: bun run typecheck

    - name: 'Run tests'
      run: bun run test
