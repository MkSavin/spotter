name: 'Lint'

on:
  workflow_dispatch:
  # On PRs this is the required gate before merging (see branch protection).
  pull_request:
    branches: [ master ]
  push:
    branches:
      - '**'
      - '!master'

permissions:
  contents: read

concurrency:
  # head_ref on PRs, ref on pushes — otherwise a branch and its PR count twice.
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Setup Biome'
      uses: biomejs/setup-biome@v2
      with:
        version: latest

    - name: 'Run Biome'
      run: biome ci .

    - name: 'Run linter'
      uses: wagoid/commitlint-github-action@v5
      with:
        configFile: commitlint.config.ts

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    - name: 'Typecheck'
      run: bun run typecheck

    - name: 'Run tests'
      run: bun run test
