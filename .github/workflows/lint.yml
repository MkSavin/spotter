name: 'Lint'

on:
  workflow_dispatch:
  # On PRs this is the required gate before merging (see branch protection).
  pull_request:
    branches: [ master ]
  push:
    branches:
      - '**'
      - '!master'

permissions:
  contents: read

concurrency:
  # Keyed per event: a push must never cancel the PR run gating the merge.
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    # Both linters come from the lockfile, so CI cannot drift from local runs.
    - name: 'Run commitlint'
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        # `before` may be zeroes or sit on another branch (merged version PR).
        if ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
          BASE=$(git rev-parse HEAD~1)
        fi
        echo "Linting $BASE..HEAD"
        bunx commitlint --from "$BASE" --to HEAD

    - name: 'Run Biome'
      run: bunx biome ci .

    - name: 'Typecheck'
      run: bun run typecheck

    - name: 'Run tests'
      run: bun run test
