name: 'Release'

on:
  push:
    branches: [ "master" ]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      checks: read
      statuses: write
      contents: write
      pull-requests: write
      packages: write

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    - name: 'Run changesets'
      id: changesets
      uses: changesets/action@v1
      with:
        title: 'chore(ci): Update packages versions'
        commit: 'chore(ci): Update packages versions'
        createGithubReleases: true
        publish: bun run publish
      env:
        GITHUB_TOKEN: ${{ secrets.GH_BYPASS_TOKEN }}

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Imperative application images building'
      if: steps.changesets.outputs.published == 'true'
      run: bun .integration/imperative.ts --versions='${{ steps.changesets.outputs.publishedPackages }}'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}