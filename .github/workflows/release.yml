name: 'Release'

on:
  push:
    branches: [ "master" ]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Transactional release: tags and GitHub Releases appear only once every image
# is in ghcr. A failed build means the release never happened, and re-running
# finishes it.
#
#   push to master with changesets → mode=version → "Update packages versions" PR
#   merging that PR                → mode=publish → images → tags + Releases
jobs:
  # Reads the changeset state and picks what happens next.
  mode:
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-images: ${{ steps.matrix.outputs.has-images }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # select-mode shells out to @changesets/cli, so deps must exist first.
    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    - name: 'Select mode'
      id: select
      uses: changesets/action/select-mode@v2

    # The merged PR already bumped package.json, so read the versions from there.
    - name: 'Resolve image build matrix'
      id: matrix
      if: steps.select.outputs.mode == 'publish'
      run: |
        matrix=$(bun .integration/imperative.ts --matrix --from-workspace)
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        count=$(echo "$matrix" | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).include.length)')
        echo "has-images=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "Resolved $count image(s) to build."

  # Changesets are pending: open or refresh the version PR. Merging it releases.
  version:
    needs: mode
    if: needs.mode.outputs.mode == 'version'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    - name: 'Create or update version PR'
      uses: changesets/action/version@v2
      with:
        github-token: ${{ secrets.GH_BYPASS_TOKEN }}
        commit-message: 'chore(ci): Update packages versions'
        pr-title: 'chore(ci): Update packages versions'

  # One image per job, so only a broken one needs a re-run.
  images:
    needs: mode
    if: needs.mode.outputs.mode == 'publish' && needs.mode.outputs.has-images == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.mode.outputs.matrix) }}

    name: 'Image (${{ matrix.code }})'

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    # The runner is amd64 only; arm64 needs emulation.
    - name: 'Set up QEMU'
      uses: docker/setup-qemu-action@v3

    - name: 'Set up Buildx'
      uses: docker/setup-buildx-action@v3

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Build and push ${{ matrix.name }}'
      run: |
        bun .integration/imperative.ts \
          --only='${{ matrix.name }}' \
          --versions='[{"name":"${{ matrix.name }}","version":"${{ matrix.version }}"}]'

  # `success` holds only if every image built; `skipped` is a packages-only release.
  publish:
    needs: [ mode, images ]
    if: >-
      needs.mode.outputs.mode == 'publish' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    - name: 'Tag packages and create releases'
      uses: changesets/action/publish@v2
      with:
        github-token: ${{ secrets.GH_BYPASS_TOKEN }}
        script: bun run publish
        create-github-releases: true
        push-git-tags: true
