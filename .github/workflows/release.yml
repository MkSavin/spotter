name: 'Release'

on:
  push:
    branches: [ "master" ]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      checks: read
      statuses: write
      contents: write
      pull-requests: write

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install

    - name: 'Run changesets'
      id: changesets
      uses: changesets/action@v1
      with:
        title: 'chore(ci): Update packages versions'
        createGithubReleases: true
        publish: bun run publish
      env:
        GITHUB_TOKEN: ${{ secrets.GH_BYPASS_TOKEN }}

    - name: 'Imperative image building'
      if: steps.changesets.outputs.hasChangesets == 'true'
      run: bunx zx .integration/imperative.mjs --versions="${{steps.changesets.outputs.publishedPackages}}"
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}