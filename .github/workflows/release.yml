name: 'Release'

on:
  push:
    branches: [ "master" ]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      checks: read
      statuses: write
      contents: write
      pull-requests: write
      packages: write

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-images: ${{ steps.matrix.outputs.has-images }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Install dependencies'
      run: bun install --frozen-lockfile

    - name: 'Run changesets'
      id: changesets
      uses: changesets/action@v1
      with:
        title: 'chore(ci): Update packages versions'
        commit: 'chore(ci): Update packages versions'
        createGithubReleases: true
        publish: bun run publish
      env:
        GITHUB_TOKEN: ${{ secrets.GH_BYPASS_TOKEN }}

    # One matrix entry per released app, so each image builds in its own job.
    - name: 'Resolve image build matrix'
      id: matrix
      if: steps.changesets.outputs.published == 'true'
      run: |
        matrix=$(bun .integration/imperative.ts --matrix --versions='${{ steps.changesets.outputs.publishedPackages }}')
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        count=$(echo "$matrix" | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).include.length)')
        echo "has-images=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "Resolved $count image(s) to build."

  # A failing image does not cancel the others: re-run only the failed jobs.
  images:
    needs: release
    if: needs.release.outputs.has-images == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release.outputs.matrix) }}

    name: 'Image (${{ matrix.code }})'

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5

    - name: 'Install bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Build and push ${{ matrix.name }}'
      run: |
        bun .integration/imperative.ts \
          --only='${{ matrix.name }}' \
          --versions='[{"name":"${{ matrix.name }}","version":"${{ matrix.version }}"}]'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
