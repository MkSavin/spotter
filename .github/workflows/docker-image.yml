name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: 'Configure NPM token'
      run: |
        tee .npmrc <<'EOF'
        @elerance:registry=https://npm.pkg.github.com
        //npm.pkg.github.com/:_authToken=${{secrets.GITHUB_TOKEN}}
        EOF
    
    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: 'Build Inventory Image'
      run: |
        docker build . --file Dockerfile --tag ghcr.io/mksavin/elercam:latest
        docker push ghcr.io/mksavin/elercam:latest
