# Single-node smoke: the real images, built locally, on real Redis and S3.
#
# Only the NVR is faked, so a run cannot reach a real camera. Everything else
# is what production runs, which is the point: this is the level that catches a
# broken Dockerfile, a missing env var or a healthcheck that never passes.
#
# `spotter-telegram` is deliberately absent. grammY is constructed with a bare
# token and no `apiRoot`, so the container would dial api.telegram.org for real
# — adding a config knob purely to satisfy a test is the wrong trade, and the
# bot's own logic is covered by the in-process suite.
name: spotter-smoke-single

x-app: &app
  restart: 'no'
  networks: [smoke]
  env_file: [./smoke.env]

services:
  redis:
    image: redis:7-alpine
    networks: [smoke]
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio
    networks: [smoke]
    environment:
      MINIO_ROOT_USER: spotter
      MINIO_ROOT_PASSWORD: spotter-smoke
    command: ['server', '/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc
    networks: [smoke]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 spotter spotter-smoke; do sleep 1; done;
      mc mb --ignore-existing local/spotter;
      "

  mosquitto:
    image: eclipse-mosquitto:2
    networks: [smoke]
    command: ['mosquitto', '-c', '/mosquitto-no-auth.conf']
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -t healthcheck -E -W 1 || exit 1']
      interval: 2s
      timeout: 3s
      retries: 15

  nvr:
    build: .
    networks: [smoke]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/version || exit 1']
      interval: 2s
      timeout: 3s
      retries: 15

  # Named volumes are created root-owned, and the images run as `bun` (uid
  # 1000). Production bind-mounts host directories instead, so this fixup is
  # specific to the smoke rig, not a gap in the images.
  volume-permissions:
    image: alpine
    networks: [smoke]
    user: root
    volumes:
      - frigate-data:/data/frigate
      - server-data:/data/server
    command: ['sh', '-c', 'chown -R 1000:1000 /data/frigate /data/server']

  spotter-frigate:
    <<: *app
    image: spotter-smoke/frigate:test
    environment:
      REDIS_URL: redis://redis:6379
      SOURCE_TYPE: frigate
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - frigate-data:/app/data
    depends_on:
      redis: { condition: service_healthy }
      nvr: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      volume-permissions: { condition: service_completed_successfully }

  spotter-depot:
    <<: *app
    image: spotter-smoke/depot:test
    environment:
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  spotter-server:
    <<: *app
    image: spotter-smoke/server:test
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - server-data:/app/data
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      volume-permissions: { condition: service_completed_successfully }


volumes:
  frigate-data:
  server-data:

networks:
  smoke:
    driver: bridge
