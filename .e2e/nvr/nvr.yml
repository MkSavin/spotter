# NVR rig: a real Frigate, a real broker, and our adapter behind them.
#
# Separate from the smoke rig on purpose. Smoke asks "does the deployment come
# up" against a fake NVR and stays light; this asks "does an event the NVR
# itself produced reach us", and pays ~500MB of Frigate image for the answer.
#
# The hop it covers — NVR to broker to adapter — is covered by nothing else,
# and it is the one that went silent in production for two days.
name: spotter-nvr

services:
  mosquitto:
    image: eclipse-mosquitto:2
    networks: [nvr]
    ports: ['1883:1883']
    command: ['mosquitto', '-c', '/mosquitto-no-auth.conf']
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -t healthcheck -E -W 1 || exit 1']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    networks: [nvr]
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 15

  probe:
    build: ../../apps/probe
    networks: [nvr]
    ports: ['8081:8080']
    # Healthcheck ships with the image, so every compose that gates on the probe
    # gets the same one.

  # Pinned: the detector plugin is an interface, not an endpoint, but it is not
  # forever. Bumping this tag is a deliberate act with a test run behind it.
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    networks: [nvr]
    shm_size: '128mb'
    # Shifted off Frigate's own numbers: 5000 is AirPlay on macOS, and the rig
    # should not fight whatever the developer already runs.
    ports:
      - '5050:5000'
      - '8654:8554'
    volumes:
      # Writable: Frigate migrates its own config across versions, and a
      # read-only mount turns that into an error on every start.
      - ./frigate.yml:/config/config.yml
      - ./media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs: { size: 200000000 }
    depends_on:
      mosquitto: { condition: service_healthy }
      probe: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5000/api/version || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio
    networks: [nvr]
    environment:
      MINIO_ROOT_USER: spotter
      MINIO_ROOT_PASSWORD: spotter-nvr-rig
    command: ['server', '/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc
    networks: [nvr]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 spotter spotter-nvr-rig; do sleep 1; done;
      mc mb --ignore-existing local/spotter;
      "

  # The real adapter image, so the rig covers what it makes of Frigate's
  # payload — not only that the payload was published.
  spotter-frigate:
    image: spotter-nvr/frigate:test
    restart: 'no'
    networks: [nvr]
    environment:
      REDIS_URL: redis://redis:6379
      SOURCE_TYPE: frigate
      MQTT_BROKER: mqtt://mosquitto:1883
      FRIGATE_REMOTE_URL: http://frigate:5000
      FRIGATE_AUTH_USER: admin
      FRIGATE_AUTH_SECRET: rig
      S3_HOST: http://minio:9000
      S3_ACCESS: spotter
      S3_SECRET: spotter-nvr-rig
      S3_BUCKET: spotter
      LOG_LEVEL: verbose
      TZ: Europe/Moscow
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
      frigate: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

networks:
  nvr:
    driver: bridge
