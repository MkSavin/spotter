# Frigate for the NVR rig: a real NVR whose eyes are spotter-probe.
#
# Everything here is the real thing except detection — Frigate does the
# tracking, the recording, the severity and the MQTT publishing itself. That
# hop is what production went two days without, and what our seeded test
# events skip entirely.

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  client_id: frigate

detectors:
  probe:
    type: zmq
    endpoint: tcp://probe:5555
    # The plugin's 200ms default resets the socket and re-runs the handshake on
    # every slow reply, which a loaded CI machine hits constantly.
    request_timeout_ms: 5000

model:
  # No weights are downloaded: the probe answers "model ready" and Frigate
  # hashes a missing path as "unknown" rather than reading it. The path must
  # still be set — the plugin takes its basename before it asks anything.
  path: /config/probe.model
  width: 320
  height: 320
  labelmap:
    0: person
    1: car

# The source loops because `source.sh` builds a long file, not because of a
# flag here: go2rtc's `#loop` ends at EOF, and `#input=` arguments land after
# the output URL where ffmpeg rejects them. A stream that dies mid-run would
# make every later test flaky.
#
# Keep comments out of `streams` — Frigate copies this block into go2rtc's own
# config verbatim, and a comment between the key and its list is enough to
# leave the stream registered with no producer running.
go2rtc:
  streams:
    front:
      - 'ffmpeg:/media/frigate/source.mp4#video=h264'

cameras:
  front:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front
          input_args: preset-rtsp-restream
          roles: [detect, record]
    detect:
      # Explicit: 0.17 defaults this to false, and a camera that captures fine
      # while never running detection looks like a broken probe rather than a
      # missing line of config.
      enabled: true
      width: 640
      height: 480
      fps: 5
    objects:
      track: [person]
    record:
      enabled: true
    snapshots:
      enabled: true

# The rig is short-lived, so keep the write volume small. `continuous.days`,
# not the `retain` of older configs: 0.17 split retention per recording kind and
# rejects the old key outright, dropping Frigate into safe mode with a CPU
# detector — which looks like a working NVR that simply never calls the probe.
record:
  enabled: true
  continuous:
    days: 1

logger:
  default: info
  logs:
    frigate.detectors.plugins.zmq_ipc: debug
    frigate.comms.mqtt: debug
version: 0.17-0
