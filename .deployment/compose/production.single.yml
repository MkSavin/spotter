# Single machine deployment - all services run on the same host.
# One combined .env for the whole stack (see .env.example).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # appendonly = durable Redis Streams: a crashed consumer's pending entries
    # survive restarts and get reclaimed by the reaper (XACK/DLQ model).
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - spotter
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  spotter-frigate:
    image: ghcr.io/mksavin/spotter-frigate:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
      SOURCE_TYPE: frigate
      MQTT_BROKER: mqtt://mosquitto:1883
    # Whole-stack config from the single combined .env. Raw media is staged to
    # S3, only keys travel onward. `environment:` above pins network endpoints.
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - redis
      - mosquitto

  spotter-depot:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_CLIENT_ID: '@spotter/depot'
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - redis
    # To use an NVIDIA GPU for transcoding, add the `deploy.resources` /
    # `devices` blocks from production.ingest.yml here.

  # Headless domain: event persistence, media orchestration, command RPC.
  spotter-server:
    image: ghcr.io/mksavin/spotter-server:latest
    container_name: spotter-server
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the domain SQLite database across container restarts.
      - ./.docker/server:/app/data
    depends_on:
      - redis

  # Telegram frontend: delivery consumer, grammy bot, commands, presigning.
  spotter-telegram:
    image: ghcr.io/mksavin/spotter-telegram:latest
    container_name: spotter-telegram
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the Telegram-local SQLite database across container restarts.
      - ./.docker/telegram:/app/data
    depends_on:
      - redis

  # Auto-update: pulls fresh :latest for labelled spotter-* only (redis and
  # mosquitto are left alone). Daily by default; --cleanup drops old layers.
  # On by default; disable with `./spotter up --no-watchtower`.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  spotter:
    driver: bridge
