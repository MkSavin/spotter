# Single machine deployment - all services run on the same host.
# One combined .env for the whole stack (see .env.example).
# Logs survive a restart and stop eating the disk: the default json-file driver
# keeps one unbounded file and throws it away when a container is recreated,
# which is exactly when its history is most wanted. 3 × 10 MB per service.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # appendonly = durable Redis Streams: a crashed consumer's pending entries
    # survive restarts and get reclaimed by the reaper (XACK/DLQ model).
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  # Own broker (OPTIONAL): only when the NVR has none of its own. Skipped with
  # `--external-mqtt`, which points MQTT_BROKER at an existing broker instead.
  mosquitto:
    <<: *logging
    profiles: [mqtt]
    image: eclipse-mosquitto:2
    container_name: spotter-mosquitto
    restart: unless-stopped
    networks:
      - spotter
      # Frigate publishes from its own compose project: joining `spotter-mqtt`
      # reaches the broker by name, with no port opened on the host.
      - mqtt
    ports:
      # Host port for an NVR that is not in Docker at all. Bound to the given
      # address only, so the broker is not exposed wider than asked.
      - '${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-1883}:1883'
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  spotter-frigate:
    <<: *logging
    image: ghcr.io/mksavin/spotter-frigate:latest
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
      # Reaches an own broker by name; harmless when the broker is external.
      - mqtt
    environment:
      REDIS_URL: redis://redis:6379
      SOURCE_TYPE: frigate
      # Set only by `--probe`, so a normal deployment reports no probe and
      # refuses staged detections outright.
      PROBE_ENDPOINT: ${PROBE_ENDPOINT:-}
    # Whole-stack config from the single combined .env — MQTT_BROKER included,
    # own broker or someone else's. Raw media is staged to S3, keys travel on.
    env_file:
      - ./.env
    volumes:
      # In-flight timelapse exports; without this a restart orphans them.
      - frigate-state:/data
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - redis

  spotter-depot:
    <<: *logging
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    # ffmpeg needs longer than Docker's 10s default to finish or abort cleanly.
    stop_grace_period: 45s
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_CLIENT_ID: '@spotter/depot'
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - redis
    # To use an NVIDIA GPU for transcoding, add the `deploy.resources` /
    # `devices` blocks from production.ingest.yml here.

  # Headless domain: event persistence, media orchestration, command RPC.
  spotter-server:
    <<: *logging
    image: ghcr.io/mksavin/spotter-server:latest
    container_name: spotter-server
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the domain SQLite database across container restarts.
      - ./.docker/server:/app/data
    depends_on:
      - redis

  # Telegram frontend: delivery consumer, grammy bot, commands, presigning.
  spotter-telegram:
    <<: *logging
    image: ghcr.io/mksavin/spotter-telegram:latest
    container_name: spotter-telegram
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the Telegram-local SQLite database across container restarts.
      - ./.docker/telegram:/app/data
    depends_on:
      - redis

  # Auto-update: pulls fresh :latest for labelled spotter-* only (redis and
  # mosquitto are left alone). Daily by default; --cleanup drops old layers.
  # On by default; disable with `./spotter up --no-watchtower`.
  watchtower:
    <<: *logging
    image: nickfedor/watchtower
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  frigate-state:

networks:
  spotter:
    driver: bridge
  # The broker's network. Own broker: this is ours, `spotter-mqtt`, and another
  # compose project can join it with `{ spotter-mqtt: { external: true } }`.
  # Someone else's broker: set MQTT_NETWORK to its network name and MQTT_NETWORK_EXTERNAL
  # to true — spotter-frigate then joins that network and resolves the broker by name.
  mqtt:
    name: ${MQTT_NETWORK:-spotter-mqtt}
    external: ${MQTT_NETWORK_EXTERNAL:-false}
