# Ingest node - the local node that handles the durable buffer, ingestion, and
# transcoding. One combined .env for this node (see .env.ingest.example).
# Logs survive a restart and stop eating the disk: the default json-file driver
# keeps one unbounded file and throws it away when a container is recreated,
# which is exactly when its history is most wanted. 3 × 10 MB per service.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  local-redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # appendonly = store-and-forward durability: events accepted before a crash
    # or WAN outage survive and are drained by the forwarder on recovery.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/local-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  # Own broker (OPTIONAL): only when the NVR has none of its own. Skipped with
  # `--external-mqtt`, which points MQTT_BROKER at an existing broker instead.
  mosquitto:
    <<: *logging
    profiles: [mqtt]
    image: eclipse-mosquitto:2
    container_name: spotter-mosquitto
    restart: unless-stopped
    networks:
      - spotter
      # Frigate publishes from its own compose project: joining `spotter-mqtt`
      # reaches the broker by name, with no port opened on the host.
      - mqtt
    ports:
      # Host port for an NVR that is not in Docker at all. Bound to the given
      # address only, so the broker is not exposed wider than asked.
      - '${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-1883}:1883'
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  spotter-frigate:
    <<: *logging
    image: ghcr.io/mksavin/spotter-frigate:latest
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
      # Reaches an own broker by name; harmless when the broker is external.
      - mqtt
    environment:
      REDIS_URL: redis://local-redis:6379
      SOURCE_TYPE: frigate
    # Node-wide config (incl. FRIGATE_* NVR creds, held ONLY on this node) from
    # the combined .env. MQTT_BROKER lives there too — own broker or someone
    # else's, the adapter does not care. Raw media is staged to S3, keys travel on.
    env_file:
      - ./.env
    volumes:
      # In-flight timelapse exports; without this a restart orphans them.
      - frigate-state:/data
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  # Two clip workers grind through long transcodes; a third is reserved for
  # snapshots and camera frames (DEPOT_LANE=snapshots), so a burst of videos
  # never delays the photo that makes a notification informative.
  spotter-depot-1:
    <<: *logging
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    # ffmpeg needs longer than Docker's 10s default to finish or abort cleanly.
    stop_grace_period: 45s
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-1'
      DEPOT_LANE: clips
    # Replica id stays inline above; shared config comes from the combined .env.
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  spotter-depot-2:
    <<: *logging
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    # ffmpeg needs longer than Docker's 10s default to finish or abort cleanly.
    stop_grace_period: 45s
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-2'
      DEPOT_LANE: clips
    # Replica id stays inline above; shared config comes from the combined .env.
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  spotter-depot-snapshots:
    <<: *logging
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    # ffmpeg needs longer than Docker's 10s default to finish or abort cleanly.
    stop_grace_period: 45s
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-snapshots'
      DEPOT_LANE: snapshots
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  spotter-forwarder:
    <<: *logging
    image: ghcr.io/mksavin/spotter-forwarder:latest
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      # Local-side Redis is the compose-network endpoint (pinned here). The
      # cloud-side REDIS_REMOTE_URL (tunnel address, e.g. redis://10.0.0.1:6379)
      # is deployer-specific and comes from the combined .env.
      REDIS_LOCAL_URL: redis://local-redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  # Auto-update: pulls fresh :latest for labelled spotter-* only (local-redis
  # and mosquitto are left alone). Daily by default; --cleanup drops old layers.
  # On by default; disable with `./spotter up --no-watchtower`.
  watchtower:
    <<: *logging
    image: nickfedor/watchtower
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  frigate-state:

networks:
  spotter:
    driver: bridge
  # The broker's network. Own broker: this is ours, `spotter-mqtt`, and another
  # compose project can join it with `{ spotter-mqtt: { external: true } }`.
  # Someone else's broker: set MQTT_NETWORK to its network name and MQTT_NETWORK_EXTERNAL
  # to true — spotter-frigate then joins that network and resolves the broker by name.
  mqtt:
    name: ${MQTT_NETWORK:-spotter-mqtt}
    external: ${MQTT_NETWORK_EXTERNAL:-false}
