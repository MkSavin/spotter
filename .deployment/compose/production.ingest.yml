# Ingest node - the local node that handles the durable buffer, ingestion, and
# transcoding. One combined .env for this node (see .env.ingest.example).
services:
  local-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # appendonly = store-and-forward durability: events accepted before a crash
    # or WAN outage survive and are drained by the forwarder on recovery.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/local-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - spotter
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  spotter-frigate:
    image: ghcr.io/mksavin/spotter-frigate:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      SOURCE_TYPE: frigate
      MQTT_BROKER: mqtt://mosquitto:1883
    # Node-wide config (incl. FRIGATE_* NVR creds, held ONLY on this node) from
    # the combined .env. Raw media is staged to S3, only keys travel onward.
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis
      - mosquitto

  spotter-depot-1:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-1'
    # Replica id stays inline above; shared config comes from the combined .env.
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  spotter-depot-2:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-2'
    # Replica id stays inline above; shared config comes from the combined .env.
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  spotter-forwarder:
    image: ghcr.io/mksavin/spotter-forwarder:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      # Local-side Redis is the compose-network endpoint (pinned here). The
      # cloud-side REDIS_REMOTE_URL (tunnel address, e.g. redis://10.0.0.1:6379)
      # is deployer-specific and comes from the combined .env.
      REDIS_LOCAL_URL: redis://local-redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      - local-redis

  # Auto-update: pulls fresh :latest for labelled spotter-* only (local-redis
  # and mosquitto are left alone). Daily by default; --cleanup drops old layers.
  # On by default; disable with `./spotter up --no-watchtower`.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  spotter:
    driver: bridge
