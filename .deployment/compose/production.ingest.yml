# Production — ingest node. Holds the local durable buffer + ingestion +
# transcoding; the bot and main Redis live on the cloud node. The forwarder is
# the only component that reaches the cloud node, over a site-to-site VPN tunnel.
#
# Example deployment: an edge box on an unreliable or restricted uplink. The
# local durable Redis lets ingestion and transcoding keep running through link
# outages, and the forwarder drains the backlog once connectivity recovers.
#
# Run from the repo root:
#   docker compose --project-directory . -f .deployment/compose/production.ingest.yml up -d
services:
  local-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # appendonly = store-and-forward durability: events accepted before a crash
    # or WAN outage survive and are drained by the forwarder on recovery.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/local-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - spotter
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  spotter-sink:
    image: ghcr.io/mksavin/spotter-sink:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      SOURCE_TYPE: frigate
      MQTT_BROKER: mqtt://mosquitto:1883
    volumes:
      - ./.env.sink:/app/.env
    depends_on:
      - local-redis
      - mosquitto

  spotter-depot-1:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-1'
    depends_on:
      - local-redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - ./.env.depot-1:/app/.env

  spotter-depot-2:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-2'
    depends_on:
      - local-redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - ./.env.depot-2:/app/.env

  spotter-forwarder:
    image: ghcr.io/mksavin/spotter-forwarder:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_LOCAL_URL: redis://local-redis:6379
      # Cloud-side Redis, reachable over the site-to-site VPN tunnel (Stage 7;
      # e.g. XRAY-VLESS or AmneziaWG 2 on restricted networks). Replace with the
      # cloud node's address inside the tunnel.
      REDIS_REMOTE_URL: redis://10.0.0.1:6379
    volumes:
      - ./.env.forwarder:/app/.env
    depends_on:
      - local-redis

networks:
  spotter:
    driver: bridge
