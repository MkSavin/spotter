# Ingest node - the local node that handles the durable buffer, ingestion, and transcoding.
services:
  local-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # appendonly = store-and-forward durability: events accepted before a crash
    # or WAN outage survive and are drained by the forwarder on recovery.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/local-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - spotter
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  spotter-frigate:
    image: ghcr.io/mksavin/spotter-frigate:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      SOURCE_TYPE: frigate
      MQTT_BROKER: mqtt://mosquitto:1883
    # .env.frigate carries the Frigate credentials (held ONLY here) and the S3
    # staging target — raw media is staged to S3, only keys travel downstream.
    volumes:
      - ./.env.frigate:/app/.env
    depends_on:
      - local-redis
      - mosquitto

  spotter-depot-1:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-1'
    depends_on:
      - local-redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - ./.env.depot-1:/app/.env

  spotter-depot-2:
    image: ghcr.io/mksavin/spotter-depot:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://local-redis:6379
      REDIS_CLIENT_ID: '@spotter/depot-2'
    depends_on:
      - local-redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    devices:
      - /dev/nvidia-caps:/dev/nvidia-caps
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - ./.env.depot-2:/app/.env

  spotter-forwarder:
    image: ghcr.io/mksavin/spotter-forwarder:latest
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_LOCAL_URL: redis://local-redis:6379
      # Cloud-side Redis, reachable over the site-to-site VPN tunnel (Stage 7;
      # e.g. XRAY-VLESS or AmneziaWG 2 on restricted networks). Replace with the
      # cloud node's address inside the tunnel.
      REDIS_REMOTE_URL: redis://10.0.0.1:6379
    volumes:
      - ./.env.forwarder:/app/.env
    depends_on:
      - local-redis

networks:
  spotter:
    driver: bridge
