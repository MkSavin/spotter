# Cloud node - the main node running Redis and the delivery frontends.
# One combined .env for this node (see .env.cloud.example).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # In a real deployment bind Redis to the private VPN interface only (e.g.
    # '10.0.0.1:6379:6379'), never publicly — the ingest forwarder connects
    # through the tunnel.
    ports:
      - '6379:6379'
    # appendonly = the main durable buffer; survives bot restarts, XACK/DLQ model
    # reclaims anything left pending.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Headless domain: event persistence, media orchestration, command RPC.
  spotter-server:
    image: ghcr.io/mksavin/spotter-server:latest
    container_name: spotter-server
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the domain SQLite database across container restarts.
      - ./.docker/server:/app/data
    depends_on:
      - redis

  # Telegram frontend: delivery consumer, grammy bot, commands, presigning.
  spotter-telegram:
    image: ghcr.io/mksavin/spotter-telegram:latest
    container_name: spotter-telegram
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the Telegram-local SQLite database across container restarts.
      - ./.docker/telegram:/app/data
    depends_on:
      - redis

  # PWA frontend (OPTIONAL): installable app and Web Push consumer.
  # Uncomment to enable; set VAPID_* in .env. Use behind HTTPS reverse proxy.
  # Service workers and Web Push require HTTPS.
  spotter-pwa:
    image: ghcr.io/mksavin/spotter-pwa:latest
    container_name: spotter-pwa
    restart: unless-stopped
    networks:
      - spotter
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist push subscriptions + feed cache across container restarts.
      - ./.docker/pwa:/app/data
    depends_on:
      - redis

  # Email frontend (OPTIONAL): SMTP consumer of spotter.delivery.event.
  # Uncomment to enable and set SMTP_* / EMAIL_RECIPIENTS in .env. Can run
  # separately if it can access Redis by IP.
  # spotter-email:
  #   image: ghcr.io/mksavin/spotter-email:latest
  #   container_name: spotter-email
  #   restart: unless-stopped
  #   networks:
  #     - spotter
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #   env_file:
  #     - ./.env
  #   labels:
  #     com.centurylinklabs.watchtower.enable: 'true'
  #   volumes:
  #     - ./.docker/email:/app/data
  #   depends_on:
  #     - redis

  # Auto-update: pulls fresh :latest for labelled spotter-* only (redis left
  # alone). Daily by default; --cleanup drops old layers.
  # On by default; disable with `make cloud WATCHTOWER=0`.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  spotter:
    driver: bridge
