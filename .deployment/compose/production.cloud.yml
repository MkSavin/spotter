# Cloud node - the main node running the Redis and Telegram bot services.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # In a real deployment bind Redis to the private VPN interface only (e.g.
    # '10.0.0.1:6379:6379'), never publicly — the ingest forwarder connects
    # through the tunnel.
    ports:
      - '6379:6379'
    # appendonly = the main durable buffer; survives bot restarts, XACK/DLQ model
    # reclaims anything left pending.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Headless domain: event persistence, media orchestration, command RPC.
  spotter-server:
    image: ghcr.io/mksavin/spotter-server:latest
    container_name: spotter-server
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.env.server:/app/.env
      # Persist the domain SQLite database across container restarts.
      - ./.docker/server:/app/data
    depends_on:
      - redis

  # Telegram frontend: delivery consumer, grammy bot, commands, presigning.
  spotter-telegram:
    image: ghcr.io/mksavin/spotter-telegram:latest
    container_name: spotter-telegram
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.env.telegram:/app/.env
      # Persist the Telegram-local SQLite database across container restarts.
      - ./.docker/telegram:/app/data
    depends_on:
      - redis

networks:
  spotter:
    driver: bridge
