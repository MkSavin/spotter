# Cloud node - the main node running Redis and the delivery frontends.
# One combined .env for this node (see .env.cloud.example).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # Loopback only — the ingest forwarder arrives through an SSH tunnel that
    # lands on 127.0.0.1 (see docs/deployment.md). Keeps Redis off the internet.
    ports:
      - '${REDIS_BIND:-127.0.0.1}:6379:6379'
    # appendonly = the main durable buffer; survives bot restarts, XACK/DLQ model
    # reclaims anything left pending.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  # Headless domain: event persistence, media orchestration, command RPC.
  spotter-server:
    image: ghcr.io/mksavin/spotter-server:latest
    container_name: spotter-server
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the domain SQLite database across container restarts.
      - ./.docker/server:/app/data
    depends_on:
      - redis

  # Telegram frontend: delivery consumer, grammy bot, commands, presigning.
  spotter-telegram:
    image: ghcr.io/mksavin/spotter-telegram:latest
    container_name: spotter-telegram
    restart: unless-stopped
    healthcheck:
      # Refreshed only while Redis answers; a wedged process goes stale.
      test: ['CMD-SHELL', 'find /tmp/spotter-alive -mmin -3 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # Persist the Telegram-local SQLite database across container restarts.
      - ./.docker/telegram:/app/data
    depends_on:
      - redis

  # Auto-update: pulls fresh :latest for labelled spotter-* only (redis left
  # alone). Daily by default; --cleanup drops old layers.
  # On by default; disable with `./spotter up --no-watchtower`.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  spotter:
    driver: bridge
