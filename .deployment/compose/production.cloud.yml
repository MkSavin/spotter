# Cloud node - the main node running the Redis and Telegram bot services.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    # In a real deployment bind Redis to the private VPN interface only (e.g.
    # '10.0.0.1:6379:6379'), never publicly — the ingest forwarder connects
    # through the tunnel.
    ports:
      - '6379:6379'
    # appendonly = the main durable buffer; survives bot restarts, XACK/DLQ model
    # reclaims anything left pending.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Headless domain: event persistence, media orchestration, command RPC.
  spotter-server:
    image: ghcr.io/mksavin/spotter-server:latest
    container_name: spotter-server
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
      - ./.env.server
    volumes:
      # Persist the domain SQLite database across container restarts.
      - ./.docker/server:/app/data
    depends_on:
      - redis

  # Telegram frontend: delivery consumer, grammy bot, commands, presigning.
  spotter-telegram:
    image: ghcr.io/mksavin/spotter-telegram:latest
    container_name: spotter-telegram
    restart: unless-stopped
    networks:
      - spotter
    environment:
      REDIS_URL: redis://redis:6379
    env_file:
      - ./.env
      - ./.env.telegram
    volumes:
      # Persist the Telegram-local SQLite database across container restarts.
      - ./.docker/telegram:/app/data
    depends_on:
      - redis

  # Email frontend (OPTIONAL): SMTP consumer of spotter.delivery.event. Sends
  # one notification email per event. Uncomment to enable; needs .env.email
  # (SMTP creds + EMAIL_RECIPIENTS). Can also run on a separate web host that
  # reaches this Redis by IP — it doesn't have to be co-located here.
  # spotter-email:
  #   image: ghcr.io/mksavin/spotter-email:latest
  #   container_name: spotter-email
  #   restart: unless-stopped
  #   networks:
  #     - spotter
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #   env_file:
  #     - ./.env
  #     - ./.env.email
  #   volumes:
  #     # Persist the email dedup ledger across container restarts.
  #     - ./.docker/email:/app/data
  #   depends_on:
  #     - redis

  # PWA frontend (OPTIONAL): Web Push consumer that also serves the web app.
  # The main frontend — installable on iPhone/Android/desktop, pushes via VAPID.
  # Uncomment to enable; needs .env.pwa (generate your own VAPID keypair with
  # `bunx web-push generate-vapid-keys`). Put it behind a TLS reverse proxy —
  # service workers and Web Push require HTTPS.
  # spotter-pwa:
  #   image: ghcr.io/mksavin/spotter-pwa:latest
  #   container_name: spotter-pwa
  #   restart: unless-stopped
  #   networks:
  #     - spotter
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #   env_file:
  #     - ./.env
  #     - ./.env.pwa
  #   volumes:
  #     # Persist push subscriptions + feed cache across container restarts.
  #     - ./.docker/pwa:/app/data
  #   depends_on:
  #     - redis

networks:
  spotter:
    driver: bridge
