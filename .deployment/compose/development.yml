# Development infra. Run apps separately via turbo
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - spotter
    ports:
      - '6379:6379'
    # appendonly keeps the streams durable across restarts (a crashed consumer's
    # pending entries survive and get reclaimed by the reaper).
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - spotter
    ports:
      - '1883:1883'
      - '8883:8883'
      - '9001:9001'
    volumes:
      - ./.deployment/mosquitto/config:/mosquitto/config
      - ./.docker/mosquitto/data:/mosquitto/data

  # S3-compatible blob store: the pipeline stages raw media and stores processed
  # results here (adapter → depot → telegram presign). Console at http://localhost:9090.
  minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - spotter
    ports:
      - '9000:9000'
      - '9090:9090'
    environment:
      MINIO_ROOT_USER: spotter
      MINIO_ROOT_PASSWORD: spotter-dev
    command: ['server', '/data', '--console-address', ':9090']
    volumes:
      - ./.docker/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: create the bucket the apps expect, then exit.
  minio-init:
    image: minio/mc
    networks:
      - spotter
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 spotter spotter-dev; do sleep 1; done;
      mc mb --ignore-existing local/spotter;
      "

networks:
  spotter:
    driver: bridge
